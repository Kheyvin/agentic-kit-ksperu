# Copiar a .github/workflows/ci.yml cuando decidas usar GitHub Actions.
name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }

      # Instala en las rutas que detecte el kit, sea cual sea el layout.
      - name: Instalar dependencias
        run: |
          source .claude/scripts/paths.sh
          echo "Layout detectado: $LAYOUT"
          [ -n "$BACKEND_DIR" ]  && (cd "$BACKEND_DIR"  && composer install --no-interaction --no-progress)
          [ -n "$FRONTEND_DIR" ] && (cd "$FRONTEND_DIR" && npm ci)
          true

      - name: Preparar base de datos
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/app_test?serverVersion=11.0.0-MariaDB
        run: |
          source .claude/scripts/paths.sh
          [ -n "$BACKEND_DIR" ] && (cd "$BACKEND_DIR" && \
            php bin/console doctrine:migrations:migrate --no-interaction && \
            php bin/console doctrine:fixtures:load --no-interaction)
          true

      # Los mismos gates que corres en local. Sin duplicar reglas.
      - name: Gate contrato
        run: bash .claude/scripts/gate-contract.sh
      - name: Gate backend
        run: bash .claude/scripts/gate-backend.sh
      - name: Gate frontend
        run: bash .claude/scripts/gate-frontend.sh

      - name: E2E Playwright
        run: |
          source .claude/scripts/paths.sh
          [ -n "$FRONTEND_DIR" ] && (cd "$FRONTEND_DIR" && npx playwright install --with-deps chromium && npx playwright test)
          true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: '**/playwright-report/'
