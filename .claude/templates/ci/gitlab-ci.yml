# Copiar a .gitlab-ci.yml cuando decidas usar GitLab CI.
stages: [gates, e2e]

variables:
  MARIADB_ROOT_PASSWORD: root
  MARIADB_DATABASE: app_test
  DATABASE_URL: "mysql://root:root@mariadb:3306/app_test?serverVersion=11.0.0-MariaDB"

default:
  image: php:8.4-cli
  services: [mariadb:11]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip jq nodejs npm libicu-dev
    - docker-php-ext-install intl pdo_mysql
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - source .claude/scripts/paths.sh
    - '[ -n "$BACKEND_DIR" ]  && (cd "$BACKEND_DIR"  && composer install --no-interaction) || true'
    - '[ -n "$FRONTEND_DIR" ] && (cd "$FRONTEND_DIR" && npm ci) || true'

gates:
  stage: gates
  script:
    - bash .claude/scripts/gate-contract.sh
    - bash .claude/scripts/gate-backend.sh
    - bash .claude/scripts/gate-frontend.sh

e2e:
  stage: e2e
  script:
    - source .claude/scripts/paths.sh
    - cd "$FRONTEND_DIR" && npx playwright install --with-deps chromium && npx playwright test
  artifacts:
    when: on_failure
    paths: ['**/playwright-report/']
